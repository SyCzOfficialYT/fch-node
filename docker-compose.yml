version: "3.8"

services:
  bch2-node:
    image: ubuntu:22.04
    container_name: bch2-node
    volumes:
      - ./data:/root/.bitcoincashII
      - ./bin:/usr/local/bin
    ports:
      - "8339:8339"   # P2P
      - "8342:8342"   # RPC
    command: >
      bash -c "
        bitcoincashIId -daemon &&
        tail -f /root/.bitcoincashII/debug.log
      "
    restart: unless-stopped

  stratum:
    build: ./stratum
    container_name: bch2-stratum
    network_mode: host
    depends_on:
      - bch2-node
    volumes:
      - ./config:/app/config
      - ./stratum:/app
    restart: unless-stopped

  monitor:
    build: ./monitor
    container_name: bch2-monitor
    network_mode: host
    depends_on:
      - stratum
    volumes:
      - ./config:/app/config
      - ./monitor:/app
    restart: unless-stopped
