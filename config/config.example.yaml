# BCH2 Solo Node Configuration

rpc:
  host: "127.0.0.1"
  port: 8342
  user: "bch2rpc"
  password: "CHANGE_ME_SECURE_PASSWORD"
  timeout: 30

pool:
  # Deine BCH2 Auszahlungsadresse
  payout_address: "bitcoincashii:qqssqww4u4rldtl04gshuqvrledjhuwy95ytdyw0xa"
  
  # Stratum Port (NerdQaxe verbindet sich hierhin)
  stratum_port: 3333
  stratum_host: "0.0.0.0"
  
  # Start-Difficulty – 256 ist gut für NerdQaxe++
  start_difficulty: 256
  
  # Job-Update Intervall in Sekunden
  job_interval: 25

monitor:
  host: "0.0.0.0"
  port: 5000
  allowed_ips: []

logging:
  level: "INFO"
  file: "logs/bch2-node.log"
