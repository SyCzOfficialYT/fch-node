name: Fix runtime installer permissions

on:
  push:
    branches: [Test]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[runtime-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch installer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/install-bch2-node.sh')
          text = path.read_text(encoding='utf-8')
          old = '    mkdir -p "$RUNTIME_DIR"'
          new = '    $SUDO mkdir -p "$RUNTIME_DIR"'
          if old not in text:
              raise SystemExit('Expected runtime mkdir line was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-runtime-installer-permissions.yml
          git add scripts/install-bch2-node.sh .github/workflows/fix-runtime-installer-permissions.yml
          git commit -m 'Fix runtime installer permissions [runtime-fix]'
          git push
